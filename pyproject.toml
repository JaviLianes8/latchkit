[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latchkit"
dynamic = ["version"]
description = "One-shot synchronization primitives for threads and asyncio: count-down latch, gates, abort with reason, zero-dependency and typed"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = [
    "threading", "asyncio", "concurrency", "latch", "countdownlatch", "countdown", "gate",
    "event", "abort", "synchronization",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-timeout", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/latchkit"
Issues = "https://github.com/JaviLianes8/latchkit/issues"
Changelog = "https://github.com/JaviLianes8/latchkit/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.version]
path = "src/latchkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/latchkit"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/dist",
    "/tests/sources/*.html",
    "/tests/sources/*.cs",
    "/tests/sources/*.go",
    "/tests/sources/*.txt",
    "/tests/sources/*.rst",
    "/IMPROVEMENTS-round.md",
    "/CERT-1.0-REPORT.md",
]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/sources"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
exclude = ["tests/sources/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# A test slower than this dumps every thread's stack, so a hang is never silent,
# and with pytest-timeout installed (the dev extra) it fails instead of hanging.
faulthandler_timeout = 120
timeout = 300
timeout_method = "thread"
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
